<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заявки — Учебный интернет-магазин</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/validation.js" defer></script>
</head>

<body>
    <header>
        <div class="site-header">
            <a class="site-logo" href="index.html">ShopProject</a>
            <nav class="site-nav" aria-label="Основная навигация">
                <ul class="site-nav__list">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="contacts.html">Контакты</a></li>
                    <li><a class="site-nav__link site-nav__link--active" href="order.html">Заявка</a></li>
                    <li><a href="cart.html">Корзина</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="section">
            <h1>Оформление заявки</h1>
            <p>Заполните форму. Ошибки выводятся на страницу без alert().</p>

            <form class="order-form" id="order-form" action="#" method="post" novalidate>
                <div class="form-field">
                    <label for="order-name">Имя</label>
                    <input id="order-name" name="name" type="text" placeholder="Введите ваше имя" autocomplete="given-name">
                    <span class="form-error" id="name-error" aria-live="polite"></span>
                </div>

                <div class="form-field">
                    <label for="order-email">E-mail</label>
                    <input id="order-email" name="email" type="email" placeholder="example@mail.ru" autocomplete="email">
                    <span class="form-error" id="email-error" aria-live="polite"></span>
                </div>

                <div class="form-field">
                    <label for="order-phone">Телефон</label>
                    <input id="order-phone" name="phone" type="tel" inputmode="tel" placeholder="+7 (900) 000-00-00">
                    <small>Формат: +7 (900) 000-00-00</small>
                    <span class="form-error" id="phone-error" aria-live="polite"></span>
                </div>

                <div class="form-field">
                    <label for="order-topic">Тема заявки</label>
                    <select id="order-topic" name="topic">
                        <option value="">Выберите тему</option>
                        <option value="product">Заказ товара</option>
                        <option value="consultation">Консультация</option>
                        <option value="delivery">Доставка</option>
                    </select>
                    <span class="form-error" id="topic-error" aria-live="polite"></span>
                </div>

                <div class="form-field">
                    <label for="order-comment">Комментарий</label>
                    <textarea id="order-comment" name="comment" rows="4" placeholder="Укажите дополнительную информацию"></textarea>
                </div>

                <div class="form-field form-field--checkbox">
                    <label>
                        <input id="order-agreement" name="agreement" type="checkbox">
                        Я согласен на обработку данных
                    </label>
                    <span class="form-error" id="agreement-error" aria-live="polite"></span>
                </div>

                <div class="form-actions">
                    <button class="button" type="submit">Отправить заявку</button>
                </div>
            </form>

            <p class="success-message" id="order-success" hidden></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Учебный проект. Все права защищены.</p>
        <p>Дисциплина: Фронтенд и бэкенд разработка</p>
    </footer>
</body>

</html>
